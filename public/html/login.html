<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <Title>Resume Matcher</Title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <link rel="stylesheet" href="../css/login-style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <nav></nav>
        <main>
            <section id="login_box">
                <div id="login_box_text">
                    <h3>Put your best foot forward</h3>
                    <p>Sign in to tailor your resume today</p>
                </div>
                <div id="login_box_input">
                    <form id="login-form">
                        <input type = "text" id="username" placeholder="Username" required>
                        <input type = "password" id="password" placeholder="Password" required>
                        <div id = "login_box_button">
                            <button type="submit" id="login-button">LOGIN</button>
                        </div>
                        <div id = 'error-message'></div>
                    </form>
                    <div id="google-login">
                        <p>Login with a Google account</p>
                        <button id="google-login-button" onclick=loginWithGoogle()>
                            <i class="fa-brands fa-google"></i>
                        </button>
                    </div>
                </div>
                <p>Don't have an account? </p>
                <a href="/">Sign up!<a>
            </section>
        </main>
        <script src="../js/login.js"></script>
    </body>
</html>
