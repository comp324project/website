<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Input Form</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/master-resume-style.css">
    <link rel="stylesheet" href="/css/sidebar-style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <ul id="sidebar" class = "close">
            <li id="sidebar-logo">
                <span class="icon"><i class="fa-solid fa-bars fa-lg" id="sidebar-toggle"></i></span>
                <div class = 'Logo'>Appliqué</div>
            </li>
            <li id="sidebar-home">
                <div class = 'navItem' >
                    <a href="home.html">
                        <i class="fa-solid fa-house fa-lg"></i>
                        <span class="text">Home</span>
                    </a>
                </div>  
            </li>
            <li class="active" id="sidebar-create">
                <div class = 'navItem' >
                    <a href="create.html">
                        <i class="fa-solid fa-plus fa-lg"></i>
                        <span class="text">Create</span>
                    </a>
                </div>
            </li>
            <li id="sidebar-master-resume">
                <div class="navItem" >
                    <a href="master-resume.html">
                        <i class="fa-solid fa-rectangle-list fa-lg"></i>
                        <span class='text'>My Resume</span>
                    </a>
                </div>
            </li>
            <li id="sidebar-analytics">
                <div class="navItem">
                    <a href = "job-analytics.html">
                        <i class="fa-solid fa-chart-column fa-lg"></i>
                        <span class='text'>Insights</span>
                    </a>
                </div>
            </li>
            <li id="sidebar-profile">
                <div class="navItem">
                    <a href = "profile.html">
                        <i class="fa-solid fa-user-tie fa-lg"></i>
                        <span class='text'>Profile</span>
                    </a>
                </div>
            </li>
            <li id="sidebar-logout">  
                <div class="navItem" >
                    <a href="index.html">
                        <i class="fa-solid fa-arrow-right-from-bracket fa-lg fa-rotate-180"></i>
                        <span class="text">Log out</span>
                    </a>
                </div>
            </li>
        </ul>
    </nav>
    <!-- End of Navigation -->
    
    <section id="master-resume">
        <h2>Resume Input Form</h2>
        <div class="container">
            <form class="input-section" onsubmit="return false">
    
                <!-- This box holds the user's information -->
                <div class="box">
                    <label>Name</label>
                    <input type="text" id="name"><br>
                    <label>Summary</label>
                    <textarea id="summary"></textarea>
                    <div class="row">
                        <input type="text" id="email" placeholder="Email" class="long-input">
                        <input type="text" id="phone" placeholder="Phone" class="short-input">
                    </div>
                    <div class="row">
                        <input type="text" id="website" placeholder="Website" class="long-input">
                        <input type="text" id="location" placeholder="Location" class="short-input">
                    </div>                
                </div>
    
                <!-- This box holds the user's skills -- this could be updated to be better -->
                <div class="box">
                    <h3>Skills</h3>
                    <textarea id="skill-input" placeholder="Enter your skills, separated by enter"></textarea> 
                    <ul id="skills-list"></ul>
                </div>
    
                <!-- This box holds the user's experience -->
                <div class="box" id="experience-section">
                    <h3>Experience</h3>
                    <div class="experience-entry">
                        <label>Company</label>
                        <input type="text" class="exp-company">
                        <div class="row">  
                            <input type="text" class="exp-title long-input" placeholder="Job Title">
                            <input type="text" class="exp-date short-input" placeholder="YYYY-MM">
                        </div>
                        <label>Description</label>
                        <textarea class="exp-description" placeholder="Describe your role and achievements"></textarea>
                    </div>
                    <button type="button" id="add-experience" onclick="addExperience()">+</button>             
                </div> <!-- TODO: To add more fields -->
            </form>
    
            <!-- TODO: To be based on an actual resume template? -->
            <div class="resume-preview" id="resume-preview">
                <h2>Resume Preview</h2>
                <p><strong>Name:</strong> <span id="res-name"></span></p>
                <p><strong>Summary:</strong> <span id="res-summary"></span></p>
                <p><strong>Email:</strong> <span id="res-name"></span> | 
                    <strong>Phone:</strong> <span id="res-name"></span>
                </p> 
                <p><strong>Website:</strong> <span id="res-name"></span> | 
                    <strong>Location:</strong> <span id="res-name"></span>
                </p> 
                <div>
                    <h3>Skills</h3>
                    <ul id="res-skills"></ul>
                </div>
                <div>
                    <h3>Experience</h3>
                    <div id="res-experience"></div>
                </div>
            </div> <!-- End of resume-preview -->
        </div> <!-- End of container -->
    </section>
    <script src="../js/resume.js" defer></script>
</body>
</html>
