    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>    
</head>
<body>

            <li class="active">

                    <a href="create.html">

                    </a>
                </div>
            </li>
            <li>
                <div class="navItem">
                    <a href="master-resume.html">
                        <i class="fa-solid fa-magnifying-glass fa-lg"></i>
                        <span class='text'>Dashboard</span>
                    </a>
                </div>
            </li>
            <li>
                <div class="navItem">
                    <a href = "job-analytics.html">

                    <a href = "profile.html">

    <h2>Resume Input Form</h2>
    <div class="container">
        <form id="master-resume">
            <div class="section">
                <label>Skillsssss</label>
                <textarea id="skills" oninput="updatePreview()"></textarea>
            </div>
            <div class="section">
                <label>Experience</label>
                <textarea id="experience" oninput="updatePreview()"></textarea>
            </div>
            <div class="section">
                <label>Projects</label>
                <textarea id="projects" oninput="updatePreview()"></textarea>
            </div>   
            <div class="section">
                <label>Research</label>
                <textarea id="research" oninput="updatePreview()"></textarea>    
            </div>
            <div class="section">
                <label>Volunteering</label>
                <textarea id="volunteering" oninput="updatePreview()"></textarea>
            </div>     
            <div class="section">
                <label>Education</label>
                <textarea id="education" oninput="updatePreview()"></textarea>
            </div>
            <div class="section">
                <label>Certifications</label>
                <textarea id="certifications" oninput="updatePreview()"></textarea>
            </div>
            <div class="section">
                <label>References</label>
                <textarea id="references" oninput="updatePreview()"></textarea>
            </div>
        </form>

        <!-- React component will be rendered here -->
         <div id="resume-preview"></div>
    </div>

    <!-- Load react script -->
    <script type="text/babel" src="../js/resume-builder.js"></script>
