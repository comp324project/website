<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Input Form</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/master-resume-style.css">
    <link rel="stylesheet" href="/css/sidebar-style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="close">
        <ul id="sidebar">
            <li id="sidebar-logo">
                <div class = 'Logo'>Appliqué</div>
                <i class="fa-solid fa-bars fa-lg" id="sidebar-toggle"></i>
            </li>
            <li id="sidebar-home">
                <div class = 'navItem' >
                    <a href="home.html">
                        <span class="text">Home</span>
                        <i class="fa-solid fa-house fa-lg"></i>
                    </a>
                </div>  
            </li>
            <li class="active" id="sidebar-create">
                <div class = 'navItem' >
                    <a href="create.html">
                        <span class="text">Create</span>
                        <i class="fa-solid fa-plus fa-lg"></i>
                    </a>
                </div>
            </li>
            <li id="sidebar-master-resume">
                <div class="navItem" >
                    <a href="master-resume.html">
                        <span class='text'>My Resume</span>
                        <i class="fa-solid fa-magnifying-glass fa-lg"></i>
                    </a>
                </div>
            </li>
            <li id="sidebar-analytics">
                <div class="navItem">
                    <a href = "job-analytics.html">
                        <span class='text'>Insights</span>
                        <i class="fa-solid fa-chart-column fa-lg"></i>
                    </a>
                </div>
            </li>
            <li id="sidebar-profile">
                <div class="navItem">
                    <a href = "profile.html">
                        <span class='text'>Profile</span>
                        <i class="fa-solid fa-user fa-lg"></i>
                    </a>
                </div>
            </li>
            <li id="sidebar-logout">  
                <div class="navItem" >
                    <a href="index.html">
                        <span class="text">Log out</span>
                        <i class="fa-solid fa-arrow-right-from-bracket fa-lg fa-rotate-180"></i>
                    </a>
                </div>
            </li>
        </ul>
    </nav>
    <h2>Resume Input Form</h2>
    <section id="master-resume">
        <div class="section">
            <label>Skills:</label>
            <div class="controls">
                <button type="button" onclick="addField('skills')"><i class="fa-solid fa-square-plus"></i></button>
                <button type="button" class="remove-button" onclick="removeField('skills')"><i class="fa-solid fa-square-minus"></i></button>
            </div>
            <div id="skills">
                <div><textarea name="skills"></textarea></div>
            </div>
        </div>
        <div class="section" id="experience">
                <div class = "section-header">
                    <label>Experience:</label>
                    <button type="button" onclick="addField('experience')"><i class="fa-solid fa-square-plus"></i></button>
                    <button type="button" class="remove-button" onclick="removeField('experience')"><i class="fa-solid fa-square-minus"></i></button>
                </div>
                <div id="experience-basic-info">
                    <div class="name">
                        <p>Company Name: </p>
                        <input type="text" id="experience-company">
                    </div>
                    <div class = "title">
                        <p>Position Title: </p>
                        <input type="text" id="experience-title">
                    </div>
                    <div class = "date">
                        <p>Date: </p>
                        <input type="text" id="experience-date">
                    </div>
                </div>
                <div class ="fields">
                    <div class="controls">
                        <p>Bullet Points: </p>
                        <button type="button" onclick="addField('experience')"><i class="fa-solid fa-square-plus"></i></button>
                        <button type="button" class="remove-button" onclick="removeField('experience')"><i class="fa-solid fa-square-minus"></i></button>
                    </div>
                    <input type="text" id="experience-field">
                </div>
        </div>

        <div class="section">
            <label>Projects:</label>
            <div class="controls">
                <button type="button" onclick="addField('projects')"><i class="fa-solid fa-square-plus"></i></button>
                <button type="button" class="remove-button" onclick="removeField('projects')"><i class="fa-solid fa-square-minus"></i></button>
            </div>
            <div id="projects">
                <div><textarea name="projects"></textarea></div>
            </div>
        </div>

        <div class="section">
            <label>Research:</label>
            <div class="controls">
                <button type="button" onclick="addField('research')"><i class="fa-solid fa-square-plus"></i></button>
                <button type="button" class="remove-button" onclick="removeField('research')"><i class="fa-solid fa-square-minus"></i></button>
            </div>
            <div id="research">
                <div><textarea name="research"></textarea></div>
            </div> 
        </div>

        <div class="section">
            <label>Volunteering:</label>
            <div class="controls">
                <button type="button" onclick="addField('volunteering')"><i class="fa-solid fa-square-plus"></i></button>
                <button type="button" class="remove-button" onclick="removeField('volunteering')"><i class="fa-solid fa-square-minus"></i></button>
            </div>
            <div id="volunteering">
                <div><textarea name="volunteering"></textarea></div>
            </div>
        </div>

        <div class="section">
            <label>Education:</label>
            <div class="controls">
                <button type="button" onclick="addField('education')"><i class="fa-solid fa-square-plus"></i></button>
                <button type="button" class="remove-button" onclick="removeField('education')"><i class="fa-solid fa-square-minus"></i></button>
            </div>
            <div id="education">
                <div><textarea name="education"></textarea></div>
            </div>
        </div>

        <div class="section">
            <label>References:</label>
            <div class="controls">
                <button type="button" onclick="addField('references')"><i class="fa-solid fa-square-plus"></i></button>
                <button type="button" class="remove-button" onclick="removeField('references')"><i class="fa-solid fa-square-minus"></i></button>
            </div>
            <div id="references">
                <div><textarea name="references"></textarea></div>
            </div>
        </div>
        <button type="submit">Submit</button>
    </section>
    <script src="../js/resume.js" defer></script>
</body>
</html>
